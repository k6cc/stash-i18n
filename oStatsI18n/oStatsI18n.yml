name: O Stats I18n
description: "Stash 统计页的 O 统计增强：今日、全部时间与纪录、亮点、活动图表（含 O 日历与观看日历热力图）、当日回顾（含 24 小时时间线与图片 O）与媒体库分区，并跨设备追踪观看时长。中文/英文跟随 Stash 界面语言。"
version: 2.2.0-1
url: https://discourse.stashapp.cc/t/o-stats/4766/7
ui:
  javascript:
    - oStatsI18n.js
  css:
    - oStatsI18n.css
  assets:
    /: .
settings:
  00_hideImageOs:
    displayName: 隐藏图片 O
    type: BOOLEAN
    description: 不计入图片上的 O。开启显示时，图片 O 会计入今日 O 数、连续天数、单日最多 O、O 次数图表和 O 日历，在「当日回顾」时间线上显示为橙色标记并出现在其「查看的内容」列表中，另有专属的「最 O 图片」亮点。平均分钟/O 只统计场景上的 O，因为图片没有观看时长。即使开启本项，每张图片上每次 O 的时间仍会被记录。默认关闭。
  01_hideTopStats:
    displayName: 隐藏今日统计行
    type: BOOLEAN
    description: 隐藏整个「今日」统计行（今日 O 数、连续天数、今日观看时长和今日观看视频数）。默认关闭。
  02_hideTopStatsOsToday:
    displayName: '[今日] 隐藏今日 O 数'
    type: BOOLEAN
    description: 隐藏「今日 O 数」。开启「隐藏今日统计行」时该项无效。默认关闭。
  04_hideTopStatsStreak:
    displayName: '[今日] 隐藏连续天数'
    type: BOOLEAN
    description: 隐藏「连续天数」。开启「隐藏今日统计行」时该项无效。默认关闭。
  04a_hideTodayWatchTime:
    displayName: '[今日] 隐藏今日观看时长'
    type: BOOLEAN
    description: 隐藏「今日观看时长」。开启「隐藏今日统计行」时该项无效。默认关闭。
  04b_hideTodayVideosWatched:
    displayName: '[今日] 隐藏今日观看视频数'
    type: BOOLEAN
    description: 隐藏「今日观看视频数」。开启「隐藏今日统计行」时该项无效。默认关闭。
  06a_hideAllTimeStats:
    displayName: 隐藏全部时间与纪录行
    type: BOOLEAN
    description: 隐藏整个「全部时间与纪录」行（O 总数、播放总数、总播放时长、单日最多 O、单日最长时长和平均分钟/O）。默认关闭。
  06b_hideTopStatsRecordDay:
    displayName: '[全部时间与纪录] 隐藏单日最多 O'
    type: BOOLEAN
    description: 隐藏「单日最多 O」。开启「隐藏全部时间与纪录行」时该项无效。默认关闭。
  06c_hideTopStatsRecordSession:
    displayName: '[全部时间与纪录] 隐藏单日最长时长'
    type: BOOLEAN
    description: 隐藏「单日最长时长」（单日观看时长最多）。开启「隐藏全部时间与纪录行」时该项无效。默认关闭。
  06d_hideTopStatsAverageMinPerO:
    displayName: '[全部时间与纪录] 隐藏平均分钟/O'
    type: BOOLEAN
    description: 隐藏「平均分钟/O」。开启「隐藏全部时间与纪录行」时该项无效。默认关闭。
  07_hideSceneHighlights:
    displayName: 隐藏亮点
    type: BOOLEAN
    description: 隐藏整个亮点行（最 O 场景、最长播放时长、最近 O、最早 O 和最 O 图片）。默认关闭。
  08_hideSceneHighlightsMostOs:
    displayName: '[亮点行] 隐藏最 O 场景'
    type: BOOLEAN
    description: 隐藏「最 O 场景」亮点。开启「隐藏亮点」时该项无效。默认关闭。
  09_hideSceneHighlightsLongestPlay:
    displayName: '[亮点行] 隐藏最长播放时长'
    type: BOOLEAN
    description: 隐藏「最长播放时长」亮点。开启「隐藏亮点」时该项无效。默认关闭。
  10_hideSceneHighlightsMostRecentO:
    displayName: '[亮点行] 隐藏最近 O'
    type: BOOLEAN
    description: 隐藏「最近 O」亮点。开启「隐藏亮点」时该项无效。默认关闭。
  11_hideSceneHighlightsOldestO:
    displayName: '[亮点行] 隐藏最早 O'
    type: BOOLEAN
    description: 隐藏「最早 O」亮点。开启「隐藏亮点」时该项无效。默认关闭。
  11a_hideHighlightsMostOImage:
    displayName: '[亮点行] 隐藏最 O 图片'
    type: BOOLEAN
    description: 隐藏「最 O 图片」亮点。开启「隐藏图片 O」时不显示。开启「隐藏亮点」时该项无效。默认关闭。
  12_hideOGraph:
    displayName: 隐藏 O 次数图表
    type: BOOLEAN
    description: 隐藏 O 次数柱状图。默认关闭。
  13_hideWatchTimeGraph:
    displayName: 隐藏观看时长图表
    type: BOOLEAN
    description: 隐藏观看时长柱状图。默认关闭。
  13a_hideOCalendar:
    displayName: 隐藏 O 日历
    type: BOOLEAN
    description: 隐藏观看时长图表下方的 O 日历热力图。默认关闭。
  13b_hideWatchCalendar:
    displayName: 隐藏观看日历
    type: BOOLEAN
    description: 隐藏 O 日历下方的观看日历热力图。默认关闭。
  15_hideOnThisDay:
    displayName: 隐藏当日回顾
    type: BOOLEAN
    description: 隐藏整个「当日回顾」区块（含其中的统计）。默认关闭。
  16_hideOnThisDayTimelineOs:
    displayName: '[当日回顾] 隐藏时间线上的 O 标记'
    type: BOOLEAN
    description: 隐藏「当日回顾」时间线上的蓝色 O 标记。默认关闭。
  17_showOnThisDayTimelineWatches:
    displayName: '[当日回顾] 显示时间线上的观看标记'
    type: BOOLEAN
    description: 在「当日回顾」时间线上显示灰色标记，表示没有 O 但观看过的视频。悬停查看缩略图，点击打开场景。默认关闭。
  20_hideOnThisDayStats:
    displayName: '[当日回顾] 隐藏统计'
    type: BOOLEAN
    description: 隐藏「当日回顾」区块底部的统计（O 总数、观看时长、观看视频数和平均分钟/O）。默认关闭。
  21_showLibraryStats:
    displayName: 显示媒体库统计
    type: BOOLEAN
    description: 在页面底部显示「媒体库」分区（场景、图片、图库、演员、工作室、合集和标签）。默认关闭。
  22_hideExportImportButtons:
    displayName: 隐藏导出/导入按钮
    type: BOOLEAN
    description: 隐藏页面底部的「导出 JSON」与「导入 JSON」按钮。默认关闭。

# 由统计页、场景播放器与图片 O 调用（runPluginOperation），读取与保存观看时长与图片 O；
# 见 osaver.py
exec:
  - python
  - '{pluginDir}/osaver.py'
interface: raw

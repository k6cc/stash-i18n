name: Lockdown I18n
description: "把 Stash 锁定到一名演员、一个工作室或一个标签，直到你出局：按 O（完成）、计时走完，或忍住不射（边缘）。叠加条件换取热度与更高分数；自带页面包含对局、排行榜（名人堂）与历史；推荐演员帮助选人，盘中看过的每张新图片加一分。锁定在所有设备上生效；长按「放弃」5 秒可提前退出。中文/英文跟随 Stash 界面语言。"
version: 2.11.0-1
url: https://gitlab.com/allisless0/stash-plugins
ui:
  javascript:
    - LockdownI18n.js

name: Lockdown I18n
description: "把 Stash 锁定到一名演员（或 2 至 4 人组合）、一个工作室或一个标签，直到你出局（对局中还能打出各种牌）：按 O（完成）、计时走完，或忍住不射（边缘）。标签既可锁定自身带标签的场景，也可锁定带该标签的演员的场景（子标签计入）。叠加条件换取热度与更高分数；多人锁定时可用「锁定牌」偏向其中一位，轮盘与标签牌会从你跳过的场景中学习。自带页面包含对局、按你看得最多的演员排行的排行榜（名人堂）、历史与身体数据。锁定在所有设备上生效。中文/英文跟随 Stash 界面语言。"
version: 2.27.2-1
url: https://gitlab.com/allisless0/stash-plugins
ui:
  javascript:
    - LockdownI18n.js
